{% extends "admin.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Batchs</h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="batchSelect">Libellé du batch</label>
                    <select id="batchSelect" class="form-control">
                        <option value="">-- Choisir un batch --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="batchSql">SQL</label>
                    <textarea id="batchSql" class="form-control" rows="6" readonly></textarea>
                </div>
                <button id="batchExecuteBtn" class="btn btn-primary" disabled>
                    <i class="fas fa-play"></i> Exécuter
                </button>
                <div id="batchResult" class="mt-3"></div>
                <div id="batchResultsTable" class="table-responsive mt-3"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
