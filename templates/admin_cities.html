{% extends "admin.html" %}

{% block content %}
<style>
    th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
    th.sortable i { opacity: 0.4; margin-left: 4px; }
    th.sortable.sort-asc i, th.sortable.sort-desc i { opacity: 1; }
    th.col-pays, td.col-pays {
        max-width: 100px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>
<div class="row">
    <div class="col-12">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Gestion des villes</h3>
                <div class="card-tools d-flex align-items-center" style="gap:8px">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text">Continent</span></div>
                        <select id="filterContinent" class="form-control form-control-sm"><option value="">Tous</option></select>
                    </div>
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text">Pays</span></div>
                        <select id="filterCountry" class="form-control form-control-sm"><option value="">Tous</option></select>
                    </div>
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text">Ville</span></div>
                        <input id="filterCityName" list="cityNameOptions" class="form-control form-control-sm" placeholder="Nom de ville" autocomplete="off" />
                        <datalist id="cityNameOptions"></datalist>
                    </div>
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text">SearchTwin</span></div>
                        <select id="filterSearchTwin" class="form-control form-control-sm">
                            <option value="">Tous</option>
                            <option value="1">Oui</option>
                            <option value="0">Non</option>
                        </select>
                    </div>
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text">Nbre jumelage</span></div>
                        <select id="filterTwinCountOp" class="form-control form-control-sm">
                            <option value="">--</option>
                            <option value=">">Plus</option>
                            <option value="<">Moins</option>
                            <option value="=">Egal</option>
                        </select>
                        <input id="filterTwinCountVal" type="number" class="form-control form-control-sm" placeholder="0" />
                    </div>
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text">Habitants</span></div>
                        <select id="filterHabitantsOp" class="form-control form-control-sm">
                            <option value="">--</option>
                            <option value=">">Plus</option>
                            <option value="<">Moins</option>
                            <option value="=">Egal</option>
                        </select>
                        <input id="filterHabitantsVal" type="number" class="form-control form-control-sm" placeholder="0" />
                    </div>
                    <div>
                        <button id="filterApply" class="btn btn-sm btn-primary">Filtrer</button>
                        <button id="filterReset" class="btn btn-sm btn-secondary">Réinitialiser</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <form id="cityForm">
                    <div class="form-row">
                        <div class="form-group col-md-3">
                            <label for="cityName">Nom</label>
                            <input id="cityName" class="form-control" required />
                        </div>
                        <div class="form-group col-md-3">
                            <label for="cityCountry">Pays</label>
                            <input id="cityCountry" class="form-control" required />
                        </div>
                        <div class="form-group col-md-3">
                            <label for="cityContinent">Continent</label>
                            <input id="cityContinent" class="form-control" required />
                        </div>
                        <div class="form-group col-md-3">
                            <label for="cityWikidata">Id Wikidata
                                <button id="openWikidataBtn" type="button" class="btn btn-sm btn-outline-info ml-2" style="vertical-align:baseline;">Wikidata</button>
                            </label>
                            <div class="input-group">
                                <input id="cityWikidata" class="form-control" placeholder="Q12345" />
                                <div class="input-group-append">
                                    <button id="wikidataFetchBtn" class="btn btn-outline-primary" type="button" disabled>Maj jumelage Wikidata</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-3">
                            <label for="cityPopulation">Habitants</label>
                            <div class="input-group">
                                <input id="cityPopulation" type="number" class="form-control" />
                                <div class="input-group-append">
                                    <button id="cityWikidataUpdateBtn" class="btn btn-outline-secondary" type="button" style="display:none">MAJ Wikidata</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group col-md-3">
                            <label for="cityLatitude">Latitude</label>
                            <input id="cityLatitude" type="number" step="any" class="form-control" required />
                        </div>
                        <div class="form-group col-md-3">
                            <label for="cityLongitude">Longitude</label>
                            <input id="cityLongitude" type="number" step="any" class="form-control" required />
                        </div>
                        <div class="form-group col-md-3 d-flex align-items-end">
                            <input type="hidden" id="cityId" />
                            <div>
                                <button class="btn btn-success mr-2" type="submit">Enregistrer</button>
                                <button id="cityReset" class="btn btn-secondary" type="button">Réinitialiser</button>
                            </div>
                        </div>
                    </div>
                </form>
                <hr />
                <table class="table table-sm table-hover">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="nom">Nom <i class="fas fa-sort"></i></th>
                            <th class="sortable col-pays" data-sort="pays">Pays <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="habitants">Habitants <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="continent">Continent <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="twinCount">Nbre de Jumelage <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="search_twin">SearchTwin <i class="fas fa-sort"></i></th>
                            <th>Wikidata</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="cityTable"></tbody>
                </table>
                <div class="d-flex flex-wrap align-items-center justify-content-between mt-2" style="gap:8px">
                    <div class="input-group input-group-sm" style="width:auto">
                        <div class="input-group-prepend"><span class="input-group-text">Lignes</span></div>
                        <select id="cityPageSize" class="form-control form-control-sm">
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="200">200</option>
                        </select>
                    </div>
                    <div class="d-flex align-items-center" style="gap:4px">
                        <button id="cityPageFirst" class="btn btn-sm btn-outline-secondary" type="button" title="Première page"><i class="fas fa-angle-double-left"></i></button>
                        <button id="cityPagePrev" class="btn btn-sm btn-outline-secondary" type="button" title="Page précédente"><i class="fas fa-angle-left"></i></button>
                        <span id="cityPageInfo" class="mx-2 text-nowrap">Page 1 / 1</span>
                        <button id="cityPageNext" class="btn btn-sm btn-outline-secondary" type="button" title="Page suivante"><i class="fas fa-angle-right"></i></button>
                        <button id="cityPageLast" class="btn btn-sm btn-outline-secondary" type="button" title="Dernière page"><i class="fas fa-angle-double-right"></i></button>
                        <input id="cityPageGoto" type="number" min="1" class="form-control form-control-sm ml-2" style="width:70px" placeholder="N° page" />
                        <button id="cityPageGo" class="btn btn-sm btn-outline-primary" type="button" title="Aller à la page"><i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>
                                <!-- Wikidata results modal -->
                                <div class="modal fade" id="wikidataModal" tabindex="-1" role="dialog" aria-labelledby="wikidataModalLabel" aria-hidden="true">
                                    <div class="modal-dialog modal-lg" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title" id="wikidataModalLabel">Jumelages Wikidata</h5>
                                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                    <span aria-hidden="true">&times;</span>
                                                </button>
                                            </div>
                                            <div class="modal-body">
                                                <div id="wikidataModalHeader" class="mb-3"></div>
                                                <table class="table table-sm">
                                                    <thead>
                                                        <tr><th>Nom</th><th>Pays</th><th>Coord</th><th>Actions</th></tr>
                                                    </thead>
                                                    <tbody id="wikidataResults"></tbody>
                                                </table>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fermer</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
